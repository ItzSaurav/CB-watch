name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Verify Python Syntax and Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Compilation and AST Syntax
        run: |
          python -m py_compile main.py
          python -c "import ast; ast.parse(open('main.py').read()); print('AST validation succeeded')"
